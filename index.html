<!DOCTYPE html>
<html lang="th">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Stock Location</title>

  <script src="https://unpkg.com/html5-qrcode"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #1f2937;
    }

    .container {
      max-width: 650px;
      margin: auto;
      padding: 14px;
    }

    .header {
      background: #14532d;
      color: white;
      padding: 20px;
      border-radius: 16px;
      margin-bottom: 14px;
    }

    .header h1 {
      margin: 0;
      font-size: 23px;
    }

    .header p {
      margin: 6px 0 0;
      opacity: .9;
      font-size: 14px;
    }

    .search-box {
      background: white;
      padding: 15px;
      border-radius: 16px;
      margin-bottom: 14px;
    }

    .input-row {
      display: flex;
      gap: 8px;
    }

    #searchInput {
      flex: 1;
      min-width: 0;
      height: 50px;
      border: 1px solid #d1d5db;
      border-radius: 11px;
      padding: 0 13px;
      font-size: 17px;
    }

    .btn-search {
      height: 50px;
      border: 0;
      border-radius: 11px;
      padding: 0 18px;
      background: #15803d;
      color: white;
      font-weight: bold;
      font-size: 16px;
    }

    .btn-scan {
      width: 100%;
      height: 54px;
      margin-top: 10px;
      border: 0;
      border-radius: 11px;
      background: #111827;
      color: white;
      font-size: 17px;
      font-weight: bold;
    }

    #reader {
      display: none;
      margin-top: 12px;
      border-radius: 12px;
      overflow: hidden;
    }

    .summary {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .summary-card {
      background: white;
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .summary-title {
      color: #6b7280;
      font-size: 11px;
    }

    .summary-value {
      margin-top: 4px;
      font-size: 25px;
      font-weight: bold;
      color: #166534;
    }

    .result-card {
      background: white;
      border-radius: 15px;
      padding: 15px;
      margin-bottom: 11px;
      border-left: 5px solid #16a34a;
    }

    .segment {
      color: #166534;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 5px;
    }

    .description {
      font-size: 17px;
      font-weight: bold;
      margin-bottom: 13px;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 90px 1fr;
      row-gap: 8px;
      font-size: 14px;
    }

    .label {
      color: #6b7280;
    }

    .value {
      font-weight: 600;
      word-break: break-word;
    }

    .location-box {
      margin-top: 14px;
      background: #ecfdf5;
      border-radius: 11px;
      padding: 13px;
      text-align: center;
    }

    .location-label {
      color: #6b7280;
      font-size: 11px;
    }

    .location-value {
      margin-top: 3px;
      color: #166534;
      font-size: 25px;
      font-weight: bold;
    }

    .message {
      text-align: center;
      color: #6b7280;
      padding: 28px 15px;
      line-height: 1.6;
    }

  </style>

</head>

<body>

<div class="container">

  <div class="header">

    <h1>📦 Stock Location</h1>

    <p>
      Barcode • Article • Pallet
    </p>

  </div>


  <div class="search-box">

    <div class="input-row">

      <input
        id="searchInput"
        type="text"
        placeholder="Barcode / Article / Pallet"
        autocomplete="off"
      >

      <button
        class="btn-search"
        onclick="searchStock()"
      >
        Search
      </button>

    </div>


    <button
      class="btn-scan"
      id="scanButton"
      onclick="toggleScanner()"
    >
      📷 Scan Barcode
    </button>


    <div id="reader"></div>

  </div>


  <div
    id="summary"
    class="summary"
  >

    <div class="summary-card">

      <div class="summary-title">
        LOCATION / PALLET
      </div>

      <div
        id="totalRecords"
        class="summary-value"
      >
        0
      </div>

    </div>


    <div class="summary-card">

      <div class="summary-title">
        TOTAL SKU
      </div>

      <div
        id="totalSku"
        class="summary-value"
      >
        0
      </div>

    </div>

  </div>


  <div id="results">

    <div class="message">
      สแกนหรือกรอก Barcode / Article / Pallet
    </div>

  </div>

</div>


<script>

/*
  สำคัญมาก:
  เปลี่ยน URL ด้านล่างเป็น Apps Script /exec ของคุณ
*/

const API_URL =
  'https://script.google.com/macros/s/AKfycbxXwQbnjyfjjYT5D1R6ddcgLBY79_s2yjBIHgCXLl71jZSeG-Mp3g3h250mv-nBACR-/exec';


let scanner = null;
let scannerRunning = false;
let scanLocked = false;


/* Enter Search */

document
  .getElementById('searchInput')
  .addEventListener(
    'keydown',
    function(event) {

      if (event.key === 'Enter') {
        searchStock();
      }

    }
  );


/* Search */

async function searchStock(value) {

  const input =
    String(
      value ||
      document
        .getElementById('searchInput')
        .value
    ).trim();


  if (!input) {

    showMessage(
      'กรุณากรอก Barcode / Article / Pallet'
    );

    return;

  }


  document
    .getElementById('searchInput')
    .value = input;


  showMessage(
    'กำลังค้นหา...'
  );


  try {

    const url =
      API_URL +
      '?q=' +
      encodeURIComponent(input);


    const response =
      await fetch(url);


    const data =
      await response.json();


    showResults(data);


  } catch (error) {

    console.error(error);

    showMessage(
      '❌ ไม่สามารถเชื่อมต่อระบบค้นหาได้'
    );

  }

}


/* Scanner */

async function toggleScanner() {

  if (scannerRunning) {

    await stopScanner();

    return;

  }


  scanLocked = false;


  const reader =
    document.getElementById('reader');


  reader.style.display =
    'block';


  scanner =
    new Html5Qrcode('reader');


  try {

    const cameras =
      await Html5Qrcode.getCameras();


    if (
      !cameras ||
      cameras.length === 0
    ) {

      throw new Error(
        'Camera not found'
      );

    }


    let cameraId =
      cameras[cameras.length - 1].id;


    for (const cam of cameras) {

      const label =
        String(
          cam.label || ''
        ).toLowerCase();


      if (
        label.includes('back') ||
        label.includes('rear')
      ) {

        cameraId =
          cam.id;

        break;

      }

    }


    const config = {

      fps: 15,

      qrbox: function(
        width,
        height
      ) {

        return {

          width:
            Math.floor(
              width * .88
            ),

          height:
            130

        };

      },

      aspectRatio:
        1.7777778,

      formatsToSupport: [

        Html5QrcodeSupportedFormats.EAN_13,

        Html5QrcodeSupportedFormats.CODE_128,

        Html5QrcodeSupportedFormats.CODE_39,

        Html5QrcodeSupportedFormats.UPC_A,

        Html5QrcodeSupportedFormats.EAN_8

      ]

    };


    await scanner.start(

      cameraId,

      config,

      onScanSuccess,

      function() {}

    );


    scannerRunning =
      true;


    document
      .getElementById('scanButton')
      .innerText =
      '✖ ปิดกล้อง';


  } catch(error) {

    console.error(error);

    await stopScanner();

    showMessage(
      '❌ เปิดกล้องไม่ได้ กรุณาตรวจสอบ Camera Permission'
    );

  }

}


/* Scan success */

async function onScanSuccess(
  decodedText
) {

  if (scanLocked) {
    return;
  }


  scanLocked =
    true;


  const barcode =
    String(
      decodedText
    ).trim();


  document
    .getElementById('searchInput')
    .value =
    barcode;


  if (navigator.vibrate) {

    navigator.vibrate(
      80
    );

  }


  await stopScanner();


  searchStock(
    barcode
  );

}


/* Stop Scanner */

async function stopScanner() {

  try {

    if (
      scanner &&
      scannerRunning
    ) {

      await scanner.stop();

      scanner.clear();

    }

  } catch(e) {}


  scannerRunning =
    false;


  document
    .getElementById('reader')
    .style.display =
    'none';


  document
    .getElementById('scanButton')
    .innerText =
    '📷 Scan Barcode';

}


/* Results */

function showResults(response) {

  if (!response.success) {

    showMessage(
      response.message
    );

    return;

  }


  if (!response.found) {

    document
      .getElementById('summary')
      .style.display =
      'none';


    showMessage(
      '❌ ไม่พบข้อมูล<br><br><strong>' +
      escapeHtml(
        response.searchText
      ) +
      '</strong>'
    );

    return;

  }


  document
    .getElementById('summary')
    .style.display =
    'grid';


  document
    .getElementById('totalRecords')
    .innerText =
    response.totalRecords;


  document
    .getElementById('totalSku')
    .innerText =
    Number(
      response.totalSku
    ).toLocaleString();


  let html = '';


  response.data.forEach(
    function(item) {

      html += `

        <div class="result-card">

          <div class="segment">
            ${escapeHtml(item.segment)}
          </div>

          <div class="description">
            ${escapeHtml(item.description)}
          </div>

          <div class="detail-grid">

            <div class="label">
              Barcode
            </div>

            <div class="value">
              ${escapeHtml(item.barcode)}
            </div>

            <div class="label">
              Article
            </div>

            <div class="value">
              ${escapeHtml(item.article)}
            </div>

            <div class="label">
              SKU
            </div>

            <div class="value">
              ${escapeHtml(item.sku)}
            </div>

            <div class="label">
              Pallet
            </div>

            <div class="value">
              ${escapeHtml(item.pallet)}
            </div>

          </div>


          <div class="location-box">

            <div class="location-label">
              LOCATION
            </div>

            <div class="location-value">
              ${escapeHtml(item.location)}
            </div>

          </div>

        </div>

      `;

    }
  );


  document
    .getElementById('results')
    .innerHTML =
    html;

}


/* Message */

function showMessage(message) {

  document
    .getElementById('results')
    .innerHTML =

    '<div class="message">' +
    message +
    '</div>';

}


/* Security */

function escapeHtml(value) {

  return String(
    value || ''
  )

    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');

}

</script>

</body>

</html>
